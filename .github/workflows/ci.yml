name: ci

on:
  push:
    branches: [main]
  pull_request:

defaults:
  run:
    working-directory: tests

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run validate
      - run: npm run links
      - run: npx playwright install --with-deps chromium
      - run: npm test
